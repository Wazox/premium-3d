<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo technique : icônes néon et photo en verre</title>
<!-- Démo de technique, volontairement sobre. Ce n'est PAS un modèle de page. -->
<style>
body{margin:0;background:#0b1020;color:#e8ecf8;font:16px/1.5 system-ui,sans-serif}
.wrap{height:100svh;position:relative}
#gl{position:absolute;inset:0;width:100%;height:100%}
p{position:absolute;left:24px;bottom:16px;margin:0;opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="wrap"><canvas id="gl" aria-hidden="true"></canvas><p>Icônes néon sous verre sur socles, photo dans un cadre, particules. Animation au temps, sans scroll.</p></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import { createStage, materials, hdr, THREE } from "../lib/core.js";
import { icon3d } from "../lib/icon3d.js";
import { pedestal, photoFrame, dust, aurora } from "../lib/objects3d.js";

const A = "#4c6ef5", B = "#e64980";
const stage = createStage(document.getElementById("gl"), { background: "#0b1020", accent: A, accent2: B });
if (stage) {
  const { scene, camera } = stage;
  camera.position.set(0, 0.6, 11); camera.lookAt(0, 0, 0);
  const bg = aurora({ colorA: A, colorB: B, base: "#0b1020" }); bg.mesh.position.z = -9; scene.add(bg.mesh);
  const names = ["scissors", "calendar", "star"];
  const svgs = await Promise.all(names.map((n) => fetch(`../icons/${n}.svg`).then((r) => r.text())));
  const items = svgs.map((svg, i) => {
    const g = new THREE.Group(); g.position.set((i - 1) * 3.2, -0.6, 0); scene.add(g);
    const p = pedestal({ radius: 0.9, material: materials.glass({ tint: B, dist: 2.5, thick: 0.6 }), ring: hdr(A, 1.6) }); g.add(p.group);
    const ic = icon3d(svg, { size: 1.5, glass: materials.glass({ tint: A, dist: 1.6, thick: 0.4 }), glow: hdr(A, 2.2) }); ic.position.y = 1.2; g.add(ic);
    return { g, ic };
  });
  /* une photo générée à la volée (dans un vrai projet : les photos du client) */
  const c = document.createElement("canvas"); c.width = 800; c.height = 500; const x = c.getContext("2d");
  const gr = x.createLinearGradient(0, 0, 800, 500); gr.addColorStop(0, A); gr.addColorStop(1, B); x.fillStyle = gr; x.fillRect(0, 0, 800, 500);
  x.fillStyle = "rgba(255,255,255,.85)"; x.font = "600 44px system-ui"; x.fillText("Votre photo ici", 60, 440);
  const photo = photoFrame(c.toDataURL(), { w: 2.6, h: 1.6, frame: materials.glass({ tint: "#dfe6ff", dist: 8, thick: 0.25, disp: 4 }) });
  photo.group.position.set(0, 2.9, -4); scene.add(photo.group);
  const d = dust({ color: hdr(A, 1.4) }); scene.add(d.points);
  await stage.warm();
  stage.start((dt, t) => {
    bg.update(t);
    items.forEach(({ ic }, i) => { ic.rotation.y = stage.reduce ? 0 : Math.sin(t * 0.6 + i * 2) * 0.6; ic.position.y = 1.2 + (stage.reduce ? 0 : Math.sin(t * 1.1 + i) * 0.06); });
    photo.group.rotation.y = stage.reduce ? 0 : Math.sin(t * 0.3) * 0.15;
    if (!stage.reduce) d.update(dt);
  });
  window.__demo = { get ready() { return stage.ready; } };
}
</script>
</body>
</html>
