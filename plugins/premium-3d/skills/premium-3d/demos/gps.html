<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo technique : trajet GPS au scroll</title>
<!-- Démo de technique, volontairement sobre. Ce n'est PAS un modèle de page : elle montre comment
     construire une scène « trajet » : ville, itinéraire qui se trace (ribbon + route), voiture qui
     le suit (pointAt, tangentAt), caméra qui passe de la vue d'ensemble à la poursuite. -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js" crossorigin>
<style>
html,body{background:#07090a}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#e8f0ee}
.scene{position:relative;height:500vh}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s}
.p3d-ready #gl{opacity:1}
.hud{position:absolute;z-index:1;left:24px;top:24px;font:600 13px/1.4 ui-monospace,monospace;letter-spacing:.06em;color:#9fb3ae}
.hud{display:flex;gap:28px}
.hud b{display:block;font:700 42px/1 system-ui,sans-serif;color:#fff;letter-spacing:0;margin-top:4px}
.pin::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(7,9,10,.85));pointer-events:none}
.caps{position:absolute;z-index:1;left:24px;bottom:28px;width:min(420px,calc(100% - 48px));height:7em}
.cap{position:absolute;inset:auto 0 0 0}
.cap h2{margin:0 0 .3em;font-size:28px}
.cap p{margin:0;color:#9fb3ae}
.p3d-pause{position:absolute;z-index:1;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;border:0;background:#1c2427;color:#fff;cursor:pointer}
.p3d-pause[data-state=playing]::before{content:"❚❚"}.p3d-pause[data-state=paused]::before{content:"▶"}
.after{padding:30vh 24px;text-align:center;color:#6f817d}
</style>
</head>
<body>
<section id="scene" class="scene" aria-label="Un itinéraire qui se trace dans une ville, suivi par une voiture">
  <div class="pin">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="hud"><div>DISTANCE<b><span id="km">0,0</span> km</b></div><div>TEMPS<b><span id="min">0</span> min</b></div></div>
    <div class="caps">
      <div class="cap"><h2>Départ</h2><p>Vue d'ensemble : le trajet n'est pas encore tracé.</p></div>
      <div class="cap"><h2>En route</h2><p>L'itinéraire se dessine, la caméra suit la voiture.</p></div>
      <div class="cap"><h2>Arrivée</h2><p>Retour à la vue d'ensemble, tout le trajet affiché.</p></div>
    </div>
    <button class="p3d-pause" type="button"></button>
  </div>
</section>
<div class="after">Fin de la démo.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import { createStage, scrollTrack, ss, neon, materials, THREE } from "../lib/core.js";
import { steps, captionSync } from "../lib/story.js";
import { motionToggle } from "../lib/interact.js";
import { ribbon, route } from "../lib/ribbon.js";
import { roundedBox } from "../lib/forms.js";
import { glowRing } from "../lib/objects3d.js";

const section = document.getElementById("scene"), track = scrollTrack(section);
const caps = captionSync(section.querySelectorAll(".cap")), km = document.getElementById("km"), min = document.getElementById("min");
const ACCENT = "#3ce0b0";
const stage = createStage(document.getElementById("gl"), { background: "#07090a", accent: ACCENT, accent2: "#7fa8ff", tone: "agx", bloom: { strength: 0.5, radius: 0.5, threshold: 1 } });
if (stage) {
  motionToggle(stage, section.querySelector(".p3d-pause"));
  const { scene, camera } = stage;
  scene.fog = new THREE.Fog("#07090a", 14, 34);
  const S = 2.2, G = 7; // écart entre deux rues, demi-taille de la grille

  /* sol et rues : rubans posés à plat (up), un seul matériau partagé */
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: "#0a0e0f", roughness: 1 }));
  scene.add(ground);
  const street = new THREE.MeshBasicMaterial({ color: "#1b2528" });
  for (let i = -G; i <= G; i++) {
    scene.add(ribbon([[-G * S, 0, i * S], [G * S, 0, i * S]], { width: 0.08, taper: 0, up: [0, 1, 0], material: street }).mesh);
    scene.add(ribbon([[i * S, 0, -G * S], [i * S, 0, G * S]], { width: 0.08, taper: 0, up: [0, 1, 0], material: street }).mesh);
  }
  scene.children.forEach((o) => { if (o.material === street) o.position.y = 0.005; });

  /* immeubles : une seule InstancedMesh, hauteurs au hasard, plus hauts au centre */
  const nB = { low: 500, mid: 900, high: 1400 }[stage.tier];
  const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const town = new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.75, metalness: 0.1, envMapIntensity: 0.35 }), nB);
  const tone = new THREE.Color();
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i = 0; i < nB; i++) {
    const cx = (Math.floor(Math.random() * 2 * G) - G + 0.5) * S, cz = (Math.floor(Math.random() * 2 * G) - G + 0.5) * S;
    const w = 0.35 + Math.random() * 0.55, d = 0.35 + Math.random() * 0.55, h = (0.12 + Math.random() * 0.55) * (1.5 - Math.hypot(cx, cz) / (G * S)); // bas : une carte, pas un canyon
    p.set(cx + (Math.random() - 0.5) * (S - 0.4 - w), 0, cz + (Math.random() - 0.5) * (S - 0.4 - d)); sc.set(w, Math.max(0.12, h), d);
    town.setMatrixAt(i, m.compose(p, q, sc)); town.setColorAt(i, tone.setHSL(0.48, 0.14, 0.022 + Math.random() * 0.018));
  }
  scene.add(town);

  /* l'itinéraire : des rues de la grille, virages arrondis ; tracé en néon */
  const pts = [[-3, -3], [-3, -1], [-1, -1], [-1, 1], [1, 1], [1, 2], [3, 2], [3, 3]].map(([x, z]) => [x * S, 0.02, z * S]);
  const path = route(pts, 0.6);
  /* trajet prévu (pâle, entier dès le début) sous le trajet parcouru (néon, qui se trace) */
  const plan = ribbon(path, { width: 0.12, taper: 0, up: [0, 1, 0], material: new THREE.MeshBasicMaterial({ color: "#2c4a43" }) });
  plan.mesh.position.y = 0.005; scene.add(plan.mesh);
  const trace = ribbon(path, { width: 0.16, taper: 0, up: [0, 1, 0], material: new THREE.MeshBasicMaterial({ color: neon(ACCENT, 1.1), toneMapped: false }) });
  trace.mesh.position.y = 0.01; scene.add(trace.mesh);
  const totalKm = 8.6; // kilomètres affichés pour le trajet complet

  /* repères de départ et d'arrivée */
  const pin = (color) => { const g = new THREE.Group(); const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), materials.enamel({ color })); head.position.y = 0.75;
    const stem = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.6, 20).rotateX(Math.PI), head.material); stem.position.y = 0.42; g.add(head, stem); return g; };
  const startPin = pin("#e8f0ee"); startPin.position.set(pts[0][0] - 0.45, 0, pts[0][2] - 0.45); scene.add(startPin); // à côté du départ : il ne cache pas la voiture
  const endPin = pin(ACCENT); endPin.position.set(...pts[pts.length - 1]); scene.add(endPin);
  const ring = glowRing(0.5, neon(ACCENT, 1.1), 0.02); ring.rotation.x = Math.PI / 2; ring.position.set(pts[pts.length - 1][0], 0.03, pts[pts.length - 1][2]); scene.add(ring);

  /* la voiture : carrosserie arrondie, vitrage, roues, phares (avant = +x) */
  const car = new THREE.Group();
  const body = new THREE.Mesh(roundedBox(0.9, 0.2, 0.42, { radius: 0.09 }), materials.metal({ color: "#e4e8ea", rough: 0.28 })); body.position.y = 0.17; car.add(body);
  const cab = new THREE.Mesh(roundedBox(0.52, 0.16, 0.37, { radius: 0.08 }), new THREE.MeshStandardMaterial({ color: "#0d1416", roughness: 0.15, metalness: 0.6 })); cab.position.set(-0.06, 0.32, 0); cab.scale.set(1, 1, 0.95); car.add(cab);
  const wheelGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.06, 20).rotateX(Math.PI / 2), tyre = new THREE.MeshStandardMaterial({ color: "#0b0b0b", roughness: 0.8 });
  for (const [x, z] of [[0.28, 0.2], [0.28, -0.2], [-0.28, 0.2], [-0.28, -0.2]]) { const w = new THREE.Mesh(wheelGeo, tyre); w.position.set(x, 0.09, z); car.add(w); }
  const lamp = new THREE.MeshBasicMaterial({ color: neon("#fff6e0", 1.5), toneMapped: false });
  const tail = new THREE.MeshBasicMaterial({ color: neon("#ff3a3a", 1.2), toneMapped: false });
  for (const z of [0.13, -0.13]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.035, 0.09), lamp); l.position.set(0.455, 0.19, z); car.add(l);
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.1), tail); r.position.set(-0.455, 0.2, z); car.add(r); }
  car.scale.setScalar(0.55); // à l'échelle des rues : une voiture n'est pas plus large que la chaussée
  scene.add(car);
  /* tête du tracé : un point lumineux sous la voiture, qui la relie au trajet */
  const head = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: neon(ACCENT, 1.3), toneMapped: false, transparent: true, opacity: 0.5, depthWrite: false }));
  head.position.y = 0.015; scene.add(head);
  const light = new THREE.DirectionalLight("#cfe8ff", 1.6); light.position.set(-6, 10, 4); scene.add(light);

  /* caméra : vue d'ensemble → poursuite → vue d'ensemble */
  const over = new THREE.Vector3(), overT = new THREE.Vector3(0, 0, 0.5), chase = new THREE.Vector3(), chaseT = new THREE.Vector3();
  const tan = new THREE.Vector3(), camPos = new THREE.Vector3(), camT = new THREE.Vector3();
  stage.onResize((w, h) => { const narrow = w / h < 1; over.set(narrow ? -4 : -6, narrow ? 26 : 17, narrow ? 18 : 13); });
  let P = 0, heading = 0, shown = -1;
  const place = (k) => {
    trace.reveal(k);
    path.getPointAt(Math.min(0.9999, k), car.position); car.position.y = 0;
    path.getTangentAt(Math.min(0.9999, k), tan);
    const target = Math.atan2(-tan.z, tan.x);
    let d = target - heading; d = Math.atan2(Math.sin(d), Math.cos(d)); heading += d * (stage.reduce ? 1 : 0.25); // virage adouci
    car.rotation.y = heading;
  };
  place(0); heading = car.rotation.y;
  await stage.warm();
  stage.start((dt, t, real) => {
    P += (track.progress() - P) * (stage.reduce ? 1 : 1 - Math.pow(0.0005, real));
    const k = ss(0.12, 0.86, P); // avancement sur le trajet
    place(k);
    km.textContent = (k * totalKm).toFixed(1).replace(".", ","); // croissants avec P : ne reculent jamais
    min.textContent = Math.floor(k * 19);
    head.position.x = car.position.x; head.position.z = car.position.z; head.scale.setScalar(1 + 0.25 * Math.sin(t * 4));
    /* poursuite : derrière la voiture, un peu au-dessus, dans l'axe de sa direction */
    const back = new THREE.Vector3(-Math.cos(heading), 0, Math.sin(heading));
    /* vue de navigation : haut au-dessus de la voiture (les immeubles ne bouchent pas la vue), regard vers l'avant */
    chase.copy(car.position).addScaledVector(back, 4.2).add(new THREE.Vector3(0, 7.5, 0));
    chaseT.copy(car.position).addScaledVector(back, -0.6); // la voiture reste au-dessus des légendes
    const w = ss(0.05, 0.16, P) * (1 - ss(0.86, 0.97, P));
    camPos.lerpVectors(over, chase, w); camT.lerpVectors(overT, chaseT, w);
    camera.position.copy(camPos); camera.lookAt(camT);
    const dist = camPos.distanceTo(camT); scene.fog.near = dist * 0.9; scene.fog.far = dist * 2.4; // brouillard réglé sur la distance : la vue d'ensemble reste lisible
    ring.scale.setScalar(1 + 0.15 * Math.sin(t * 3) * ss(0.84, 0.9, P)); ring.material.opacity = 0.3 + 0.7 * ss(0.8, 0.9, P);
    const i = P < 0.1 ? 0 : P < 0.88 ? 1 : 2;
    if (i !== shown) { shown = i; caps.show(i); }
  });
}
window.__demo = { get ready() { return !stage || stage.ready; } };
</script>
</body>
</html>
